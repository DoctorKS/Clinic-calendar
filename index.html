<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="เวรคลินิก">
<title>เวรคลินิก</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a6b5a;
    --primary-light: #e8f5f1;
    --primary-mid: #2d9c80;
    --accent: #f0a500;
    --accent-light: #fff8e6;
    --bg: #f5f7f6;
    --card: #ffffff;
    --text: #1a2421;
    --text-muted: #6b8178;
    --border: #dde8e4;
    --danger: #e84040;
    --success: #1a9060;
    --shadow: 0 2px 12px rgba(26,107,90,0.10);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    background: var(--primary);
    color: #fff;
    padding: 52px 20px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .nav-btn {
    background: rgba(255,255,255,0.18);
    border: none;
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .nav-btn:active { background: rgba(255,255,255,0.30); }

  .month-label {
    font-size: 17px;
    font-weight: 600;
    min-width: 120px;
    text-align: center;
  }

  /* Weekday row */
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: var(--primary);
    padding: 4px 8px 8px;
  }
  .weekday {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    padding: 2px 0;
  }

  /* Calendar grid */
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    padding: 8px;
    background: var(--bg);
  }

  .day-cell {
    background: var(--card);
    border-radius: var(--radius-sm);
    min-height: 58px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 2px 4px;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
  }

  .day-cell:active { background: var(--primary-light); }

  .day-cell.today {
    border-color: var(--primary);
  }

  .day-cell.has-data {
    background: var(--primary-light);
  }

  .day-cell.empty {
    background: transparent;
    cursor: default;
    pointer-events: none;
  }

  .day-cell.selected {
    border-color: var(--primary-mid);
    background: var(--primary-light);
  }

  .day-num {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
  }

  .day-cell.today .day-num {
    background: var(--primary);
    color: #fff;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  .day-cell.sunday .day-num { color: #c0392b; }
  .day-cell.saturday .day-num { color: #2471a3; }

  .day-income {
    font-size: 9.5px;
    font-weight: 700;
    color: var(--primary);
    margin-top: 3px;
    text-align: center;
    line-height: 1.2;
    word-break: break-all;
  }

  /* Summary bar */
  .summary-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    background: var(--primary);
    color: #fff;
    padding: 14px 20px 28px;
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 -4px 24px rgba(26,107,90,0.18);
  }

  .summary-label {
    font-size: 13px;
    font-weight: 500;
    opacity: 0.8;
  }

  .summary-total {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .summary-sub {
    font-size: 11px;
    opacity: 0.7;
    margin-top: 1px;
  }

  /* Calendar has bottom padding to not hide under summary bar */
  .calendar-wrap {
    padding-bottom: 100px;
  }

  /* Modal Overlay */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,30,25,0.45);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .overlay.open { display: flex; }

  /* Bottom sheet */
  .sheet {
    background: var(--card);
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-width: 430px;
    padding: 0 0 40px;
    animation: slideUp 0.28s cubic-bezier(0.34,1.56,0.64,1);
    max-height: 90vh;
    overflow-y: auto;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .sheet-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 0;
  }

  .sheet-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sheet-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--primary);
  }

  .sheet-date {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .close-btn {
    background: var(--bg);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Form */
  .form-body {
    padding: 16px 20px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .form-label .icon {
    font-size: 14px;
  }

  .form-input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-family: 'Sarabun', sans-serif;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  .form-input:focus { border-color: var(--primary-mid); background: #fff; }

  .input-suffix {
    position: relative;
  }
  .input-suffix .form-input { padding-right: 52px; }
  .suffix-label {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
    pointer-events: none;
  }

  /* Result card */
  .result-card {
    margin: 0 20px 16px;
    background: var(--primary-light);
    border-radius: var(--radius);
    padding: 16px;
    border: 1.5px solid rgba(45,156,128,0.25);
  }

  .result-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    font-size: 14px;
  }

  .result-row-label { color: var(--text-muted); }
  .result-row-val { font-weight: 600; color: var(--text); }

  .result-divider {
    height: 1px;
    background: rgba(45,156,128,0.2);
    margin: 8px 0;
  }

  .result-total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 4px;
  }
  .result-total-label { font-size: 15px; font-weight: 700; color: var(--primary); }
  .result-total-val { font-size: 20px; font-weight: 700; color: var(--primary); }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 10px;
    padding: 0 20px;
  }

  .btn {
    flex: 1;
    padding: 14px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 700;
    font-family: 'Sarabun', sans-serif;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); opacity: 0.85; }

  .btn-primary {
    background: var(--primary);
    color: #fff;
  }

  .btn-danger {
    background: #fde8e8;
    color: var(--danger);
    flex: 0;
    padding: 14px 18px;
  }

  /* No data state */
  .no-data {
    text-align: center;
    padding: 20px;
    color: var(--text-muted);
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>🏥 เวรคลินิก</h1>
  </div>
  <div class="month-nav">
    <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
    <span class="month-label" id="monthLabel"></span>
    <button class="nav-btn" onclick="changeMonth(1)">›</button>
  </div>
</div>
<div class="weekdays">
  <div class="weekday">อา</div>
  <div class="weekday">จ</div>
  <div class="weekday">อ</div>
  <div class="weekday">พ</div>
  <div class="weekday">พฤ</div>
  <div class="weekday">ศ</div>
  <div class="weekday">ส</div>
</div>

<div class="calendar-wrap">
  <div class="calendar-grid" id="calGrid"></div>
</div>

<div class="summary-bar">
  <div>
    <div class="summary-label">รวมเดือนนี้</div>
    <div class="summary-sub" id="summaryShiftCount">0 เวร</div>
  </div>
  <div style="text-align:right">
    <div class="summary-total" id="summaryTotal">฿0</div>
  </div>
</div>

<!-- Bottom Sheet Modal -->
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div>
        <div class="sheet-title" id="sheetTitle"></div>
        <div class="sheet-date" id="sheetDate"></div>
      </div>
      <button class="close-btn" onclick="closeSheet()">✕</button>
    </div>

    <div class="form-body">
      <div class="form-group">
        <label class="form-label"><span class="icon">💰</span>ค่านั่งต่อชั่วโมง (บาท)</label>
        <div class="input-suffix">
          <input class="form-input" type="number" id="inHourRate" placeholder="เช่น 500" inputmode="decimal" oninput="calcPreview()">
          <span class="suffix-label">บาท/ชม</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label"><span class="icon">⏰</span>จำนวนชั่วโมงที่นั่ง</label>
        <div class="input-suffix">
          <input class="form-input" type="number" id="inHours" placeholder="เช่น 4" inputmode="decimal" oninput="calcPreview()">
          <span class="suffix-label">ชม</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label"><span class="icon">💉</span>ราคาหัตถการรวม (บาท)</label>
        <div class="input-suffix">
          <input class="form-input" type="number" id="inProcedure" placeholder="เช่น 10000" inputmode="decimal" oninput="calcPreview()">
          <span class="suffix-label">บาท</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label"><span class="icon">👨‍⚕️</span>% Doctor Fee จากหัตถการ</label>
        <div class="input-suffix">
          <input class="form-input" type="number" id="inDoctorPct" placeholder="เช่น 30" inputmode="decimal" oninput="calcPreview()">
          <span class="suffix-label">%</span>
        </div>
      </div>
      <div style="height:1px;background:var(--border);margin:4px 0 16px;"></div>
      <div class="form-group" style="display:flex;gap:10px;align-items:flex-end;">
        <div style="flex:1.4;">
          <label class="form-label"><span class="icon">🤖</span>ค่าทำเครื่อง (บาท)</label>
          <div class="input-suffix">
            <input class="form-input" type="number" id="inMachine" placeholder="เช่น 5000" inputmode="decimal" oninput="calcPreview()">
            <span class="suffix-label">บาท</span>
          </div>
        </div>
        <div style="flex:1;">
          <label class="form-label">% Doctor fee จากเครื่อง</label>
          <div class="input-suffix">
            <input class="form-input" type="number" id="inMachinePct" placeholder="เช่น 20" inputmode="decimal" oninput="calcPreview()">
            <span class="suffix-label">%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Live preview result -->
    <div class="result-card" id="resultCard">
      <div class="result-title">สรุปค่าเวร</div>
      <div class="result-row">
        <span class="result-row-label">ค่านั่ง</span>
        <span class="result-row-val" id="rSitting">—</span>
      </div>
      <div class="result-row">
        <span class="result-row-label">Doctor Fee (หัตถการ)</span>
        <span class="result-row-val" id="rDoctor">—</span>
      </div>
      <div class="result-row">
        <span class="result-row-label">Doctor Fee (เครื่อง)</span>
        <span class="result-row-val" id="rMachine">—</span>
      </div>
      <div class="result-divider"></div>
      <div class="result-total-row">
        <span class="result-total-label">รวมทั้งหมด</span>
        <span class="result-total-val" id="rTotal">฿0</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-danger" onclick="clearDay()" id="btnClear" style="display:none">ลบ</button>
      <button class="btn btn-primary" onclick="saveDay()">บันทึก ✓</button>
    </div>
  </div>
</div>

<script>
const MONTHS_TH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

let today = new Date();
let curYear = today.getFullYear();
let curMonth = today.getMonth();
let selectedDay = null;

function storageKey(year, month) { return `clinic_${year}_${month}`; }

function getData(year, month) {
  try { return JSON.parse(localStorage.getItem(storageKey(year, month)) || '{}'); }
  catch(e) { return {}; }
}

function saveData(year, month, data) {
  localStorage.setItem(storageKey(year, month), JSON.stringify(data));
}

function fmt(n) {
  if (!n && n !== 0) return '—';
  return '฿' + Math.round(n).toLocaleString('th-TH');
}

function fmtCompact(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
  if (n >= 1000) return (n/1000).toFixed(0)+'k';
  return Math.round(n).toLocaleString('th-TH');
}

function changeMonth(delta) {
  curMonth += delta;
  if (curMonth < 0) { curMonth = 11; curYear--; }
  if (curMonth > 11) { curMonth = 0; curYear++; }
  renderCalendar();
}

function renderCalendar() {
  document.getElementById('monthLabel').textContent = MONTHS_TH[curMonth] + ' ' + (curYear + 543);
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const data = getData(curYear, curMonth);
  const firstDay = new Date(curYear, curMonth, 1).getDay();
  const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();

  // Empty cells
  for (let i = 0; i < firstDay; i++) {
    const cell = document.createElement('div');
    cell.className = 'day-cell empty';
    grid.appendChild(cell);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const cell = document.createElement('div');
    const dow = (firstDay + d - 1) % 7;
    let cls = 'day-cell';
    if (dow === 0) cls += ' sunday';
    if (dow === 6) cls += ' saturday';
    if (d === today.getDate() && curMonth === today.getMonth() && curYear === today.getFullYear()) cls += ' today';

    const dayData = data[d];
    if (dayData) cls += ' has-data';

    cell.className = cls;
    cell.dataset.day = d;

    const numEl = document.createElement('div');
    numEl.className = 'day-num';
    numEl.textContent = d;
    cell.appendChild(numEl);

    if (dayData && dayData.total > 0) {
      const incEl = document.createElement('div');
      incEl.className = 'day-income';
      incEl.textContent = fmtCompact(dayData.total);
      cell.appendChild(incEl);
    }

    cell.addEventListener('click', () => openSheet(d));
    grid.appendChild(cell);
  }

  updateSummary();
}

function openSheet(day) {
  selectedDay = day;
  const data = getData(curYear, curMonth);
  const dayData = data[day] || {};
  const dateObj = new Date(curYear, curMonth, day);
  const dayNames = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];

  document.getElementById('sheetTitle').textContent = `วันที่ ${day} ${MONTHS_TH[curMonth]}`;
  document.getElementById('sheetDate').textContent = `วัน${dayNames[dateObj.getDay()]}`;

  document.getElementById('inHourRate').value = dayData.hourRate || '';
  document.getElementById('inHours').value = dayData.hours || '';
  document.getElementById('inProcedure').value = dayData.procedure || '';
  document.getElementById('inDoctorPct').value = dayData.doctorPct || '';
  document.getElementById('inMachine').value = dayData.machine || '';
  document.getElementById('inMachinePct').value = dayData.machinePct || '';

  document.getElementById('btnClear').style.display = dayData.total ? 'block' : 'none';

  calcPreview();

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
  selectedDay = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeSheet();
}

function calcPreview() {
  const hourRate = parseFloat(document.getElementById('inHourRate').value) || 0;
  const hours = parseFloat(document.getElementById('inHours').value) || 0;
  const procedure = parseFloat(document.getElementById('inProcedure').value) || 0;
  const doctorPct = parseFloat(document.getElementById('inDoctorPct').value) || 0;
  const machine = parseFloat(document.getElementById('inMachine').value) || 0;
  const machinePct = parseFloat(document.getElementById('inMachinePct').value) || 0;

  const sitting = hourRate * hours;
  const doctorFee = procedure * (doctorPct / 100);
  const machineFee = machine * (machinePct / 100);
  const total = sitting + doctorFee + machineFee;

  document.getElementById('rSitting').textContent = sitting > 0 ? fmt(sitting) : '—';
  document.getElementById('rDoctor').textContent = doctorFee > 0 ? fmt(doctorFee) : '—';
  document.getElementById('rMachine').textContent = machineFee > 0 ? fmt(machineFee) : '—';
  document.getElementById('rTotal').textContent = fmt(total);
}

function saveDay() {
  if (!selectedDay) return;
  const hourRate = parseFloat(document.getElementById('inHourRate').value) || 0;
  const hours = parseFloat(document.getElementById('inHours').value) || 0;
  const procedure = parseFloat(document.getElementById('inProcedure').value) || 0;
  const doctorPct = parseFloat(document.getElementById('inDoctorPct').value) || 0;
  const machine = parseFloat(document.getElementById('inMachine').value) || 0;
  const machinePct = parseFloat(document.getElementById('inMachinePct').value) || 0;

  const sitting = hourRate * hours;
  const doctorFee = procedure * (doctorPct / 100);
  const machineFee = machine * (machinePct / 100);
  const total = sitting + doctorFee + machineFee;

  const data = getData(curYear, curMonth);
  data[selectedDay] = { hourRate, hours, procedure, doctorPct, machine, machinePct, sitting, doctorFee, machineFee, total };
  saveData(curYear, curMonth, data);

  closeSheet();
  renderCalendar();
}

function clearDay() {
  if (!selectedDay) return;
  const data = getData(curYear, curMonth);
  delete data[selectedDay];
  saveData(curYear, curMonth, data);
  closeSheet();
  renderCalendar();
}

function updateSummary() {
  const data = getData(curYear, curMonth);
  let total = 0;
  let count = 0;
  Object.values(data).forEach(d => {
    if (d && d.total > 0) { total += d.total; count++; }
  });
  document.getElementById('summaryTotal').textContent = '฿' + Math.round(total).toLocaleString('th-TH');
  document.getElementById('summaryShiftCount').textContent = count + ' เวร';
}

renderCalendar();
</script>
</body>
</html>
